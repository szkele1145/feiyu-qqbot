plugins {
    id 'com.android.application'
}

android {
    namespace 'com.feiyu.qqbot'
    compileSdk 34

    defaultConfig {
        applicationId "com.feiyu.qqbot"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
