name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 运行测试
        run: pytest tests/ -v

  build-windows:
    name: 构建 Windows 安装程序
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: PyInstaller 打包
        run: python packaging\build.py --clean

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 编译安装程序
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc packaging\installer.iss
          Get-ChildItem dist\installer\*.exe | ForEach-Object { Write-Host "安装程序: $($_.Name) $([math]::Round($_.Length/1MB,1))MB" }

      - name: 上传安装程序
        uses: actions/upload-artifact@v4
        with:
          name: feiyu-qqbot-windows-installer
          path: dist/installer/*.exe

  build-linux:
    name: 构建 Linux 发行包
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: PyInstaller 打包
        run: python packaging/build.py --clean

      - name: 打包 tar.gz
        run: |
          cd dist
          tar czf ../feiyu-qqbot-linux-x86_64.tar.gz feiyu-qqbot install.sh
          cd ..
          cp install.sh dist/install.sh

      - name: 上传 Linux 发行包
        uses: actions/upload-artifact@v4
        with:
          name: feiyu-qqbot-linux
          path: feiyu-qqbot-linux-x86_64.tar.gz

  build-android:
    name: 构建 Android (Termux) 发行包
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 准备 Android 发行包
        run: |
          mkdir -p dist/android/feiyu-qqbot/src
          cp -r src/feiyu_bot dist/android/feiyu-qqbot/src/
          cp termux-install.sh dist/android/
          cp requirements.txt dist/android/
          cp README.md dist/android/
          cd dist/android
          tar czf ../feiyu-qqbot-android-termux.tar.gz feiyu-qqbot termux-install.sh requirements.txt README.md

      - name: 上传 Android 发行包
        uses: actions/upload-artifact@v4
        with:
          name: feiyu-qqbot-android-termux
          path: feiyu-qqbot-android-termux.tar.gz

  release:
    name: 发布 Release
    needs: [test, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 整理 Release 附件
        run: |
          mkdir -p release-assets
          cp artifacts/*.exe release-assets/ 2>/dev/null || true
          cp artifacts/*.tar.gz release-assets/ 2>/dev/null || true
          ls -lh release-assets/

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## feiyu-qqbot ${{ github.ref_name }}

            QQ 开放平台官方机器人 AI Agent（WebSocket 主动接入）。

            ### 下载
            | 平台 | 文件 |
            |---|---|
            | Windows | `feiyu-qqbot-setup-*.exe`（安装程序） |
            | Linux | `feiyu-qqbot-linux-x86_64.tar.gz` |
            | Android | `feiyu-qqbot-android-termux.tar.gz`（Termux 一键装） |

            ### 快速开始
            1. 到 [QQ 开放平台](https://q.qq.com) 申请机器人，拿到 AppID 与 AppSecret
            2. 解压/安装后编辑 `config.yaml`，填入 `qq.appid` / `qq.secret` / `llm.api_key`
            3. 运行 `feiyu-qqbot`（Windows）或 `./run.sh`（Linux）
            4. 打开 WebUI：<http://127.0.0.1:8720>

            > 敏感字段在保存时自动加密落盘（Fernet），配置文件里不会出现明文密钥。
