name: 构建发布

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      make_android:
        description: "是否构建 Android APK"
        type: boolean
        default: true
      make_linux:
        description: "是否构建 Linux 发行包"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows 安装程序
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: 生成图标
        run: python packaging/make_icon.py

      - name: 构建 exe
        run: python packaging/build.py

      - name: 构建安装程序
        run: python packaging/build_installer.py

      - name: 打包 Linux 发行包
        if: ${{ inputs.make_linux != false }}
        run: python packaging/make_linux_bundle.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/installer/*.exe
            dist/feiyu-qqbot-linux-x86_64.tar.gz
          retention-days: 30
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 SDK 许可
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle') }}

      - name: 生成应用图标
        run: python packaging/make_android_icons.py

      - name: 构建 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

  release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: [windows, android]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release 并上传
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python packaging/publish_release.py \
            --tag "${GITHUB_REF_NAME}" \
            --assets artifacts
